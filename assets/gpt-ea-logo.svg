<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">GPT_EA — AI-Assisted MT5 Trading Intelligence</title>
  <desc id="desc">A premium dark gradient logo combining a shield, neural circuit, candlestick chart and the GPT_EA wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07111f"/>
      <stop offset="0.55" stop-color="#10182f"/>
      <stop offset="1" stop-color="#171025"/>
    </linearGradient>
    <linearGradient id="neon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ee7ff"/>
      <stop offset="0.5" stop-color="#7a7cff"/>
      <stop offset="1" stop-color="#c06cff"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0a6"/>
      <stop offset="1" stop-color="#f5b942"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000" flood-opacity=".35"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="1184" height="304" rx="36" fill="url(#bg)" stroke="#27345c" stroke-width="2" filter="url(#soft)"/>
  <path d="M36 254 C220 208 298 292 470 238 S760 180 1164 230" fill="none" stroke="#27345c" stroke-width="2" opacity=".55"/>
  <path d="M34 82 C220 132 334 48 520 98 S834 156 1168 90" fill="none" stroke="#1b2c4f" stroke-width="2" opacity=".55"/>

  <g transform="translate(62 43)">
