name: GPT_EA Static Release Gate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  static-release-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run GPT_EA static release checks
        shell: bash
        run: |
          set -o pipefail
          python tools/check_mql_static.py 2>&1 | tee static-check.txt
      - name: Upload static diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gpt-ea-static-check
          path: static-check.txt
          if-no-files-found: warn
