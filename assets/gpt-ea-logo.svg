      <rect x="2" y="12" width="12" height="12" rx="2" fill="#65e6be"/>
      <line x1="33" y1="35" x2="33" y2="1" stroke="#ff6f91"/>
      <rect x="27" y="8" width="12" height="19" rx="2" fill="#ff6f91"/>
      <line x1="58" y1="29" x2="58" y2="3" stroke="#65e6be"/>
      <rect x="52" y="9" width="12" height="13" rx="2" fill="#65e6be"/>
